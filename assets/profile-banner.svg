<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Jay Tyagi — building reliable AI systems</title>
  <desc id="desc">An animated dark product-engineering hero showing a subtle live system scan.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset="1" stop-color="#101b31"/></linearGradient>
    <linearGradient id="signal" x1="0" x2="1"><stop stop-color="#8cf1d2"/><stop offset="1" stop-color="#77a7ff"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b6cae7" fill-opacity=".16"/></pattern>
    <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#8cf1d2" stop-opacity="0"/><stop offset=".5" stop-color="#8cf1d2" stop-opacity=".58"/><stop offset="1" stop-color="#8cf1d2" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#background)"/>
  <rect width="1280" height="360" rx="16" fill="url(#dots)"/>
  <rect x="64" y="51" width="1152" height="258" rx="12" fill="#0c1424" fill-opacity=".78" stroke="#7f9cc6" stroke-opacity=".28"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.4">
    <circle cx="91" cy="81" r="5" fill="#8cf1d2"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="107" y="85" fill="#a9bedf">JAY.TYAGI / SYSTEMS LAB</text><text x="1064" y="85" fill="#7890b3">STATUS: BUILDING</text>
  </g>
  <line x1="90" y1="108" x2="1190" y2="108" stroke="#819ac1" stroke-opacity=".25"/>
  <g transform="translate(92 148)" font-family="Arial, Helvetica, sans-serif"><text fill="#f0f5ff" font-size="44" font-weight="700" letter-spacing="-1.2">Building reliable AI systems.</text><text y="40" fill="#aabbd6" font-size="18">Products, infrastructure, and tools that make complex work inspectable.</text></g>
  <g transform="translate(94 253)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><text fill="#8cf1d2">›</text><text x="19" fill="#d7e4f8">now:</text><text x="61" fill="#aebfdb">Cognlay</text><text x="127" fill="#6f87aa">/</text><text x="145" fill="#d7e4f8">exploring:</text><text x="231" fill="#aebfdb">multi-agent systems</text><rect x="386" y="-12" width="8" height="16" fill="#8cf1d2"><animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(877 153)"><path d="M0 62H62L83 20L121 96L153 46L188 62H291" fill="none" stroke="#91a9ca" stroke-opacity=".35" stroke-width="2"/><path d="M0 62H62L83 20L121 96L153 46L188 62H291" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="24 310" stroke-dashoffset="334"><animate attributeName="stroke-dashoffset" from="334" to="-24" dur="3.2s" repeatCount="indefinite"/></path><circle cx="153" cy="46" r="13" fill="#8cf1d2" fill-opacity=".13" filter="url(#soft)"><animate attributeName="opacity" values=".16;.75;.16" dur="2s" repeatCount="indefinite"/></circle><circle cx="153" cy="46" r="4" fill="#8cf1d2"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#91a7c7"><text x="0" y="130">CHANGE</text><text x="102" y="130">REASON</text><text x="220" y="130">EVIDENCE</text></g></g>
  <rect x="64" y="298" width="1152" height="2" fill="url(#scan)" opacity=".72"><animate attributeName="y" values="298;110;298" dur="5.5s" repeatCount="indefinite"/></rect>
</svg>
