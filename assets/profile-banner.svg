<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Jay Tyagi — systems for the work behind the work</title>
  <desc id="desc">A dark navy editorial banner with a grid, a highlighted system map, and an ImpactOS-inspired accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b33"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8af0d1"/><stop offset="1" stop-color="#78a8ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a9bbd8" stroke-opacity=".09" stroke-width="1"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="430" rx="18" fill="url(#bg)"/><rect width="1280" height="430" rx="18" fill="url(#grid)"/>
  <circle cx="1110" cy="80" r="250" fill="#315bca" fill-opacity=".11"/><circle cx="1030" cy="360" r="190" fill="#69dac3" fill-opacity=".07"/>
  <g fill="none" stroke="#91a9cf" stroke-opacity=".36" stroke-width="1.5"><path d="M810 123H1020V178H1178"/><path d="M810 270H942V205H1083"/><path d="M942 205V337H1160"/></g>
  <g filter="url(#glow)"><circle cx="1020" cy="178" r="7" fill="#8af0d1"/><circle cx="942" cy="205" r="7" fill="#78a8ff"/><circle cx="1083" cy="205" r="7" fill="#8af0d1"/></g>
  <g fill="#0c192b" stroke="#90a7c7" stroke-opacity=".4"><rect x="1130" y="151" width="99" height="54" rx="8"/><rect x="1112" y="310" width="116" height="54" rx="8"/><rect x="765" y="95" width="101" height="54" rx="8"/></g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#b8cae5" font-size="11" letter-spacing="1.4"><text x="1144" y="181">CHANGE</text><text x="1127" y="340">EVIDENCE</text><text x="780" y="125">SYSTEM</text></g>
  <rect x="68" y="72" width="48" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="68" y="126" fill="#e9f1ff" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" letter-spacing="-1.6">Jay Tyagi</text>
  <text x="68" y="169" fill="#a9bbd8" font-family="Arial, Helvetica, sans-serif" font-size="18">AI products · backend systems · developer infrastructure</text>
  <line x1="68" y1="210" x2="532" y2="210" stroke="#91a9cf" stroke-opacity=".33"/>
  <text x="68" y="254" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">I build systems for the work behind the work.</text>
  <text x="68" y="290" fill="#a9bbd8" font-family="Arial, Helvetica, sans-serif" font-size="16">Traceable AI, reliable workflows, and tools people can inspect.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2"><rect x="68" y="332" width="116" height="31" rx="15.5" fill="#18304a" stroke="#8af0d1" stroke-opacity=".5"/><text x="89" y="353" fill="#9cf3d8">COGNLAY</text><rect x="196" y="332" width="126" height="31" rx="15.5" fill="#18304a" stroke="#78a8ff" stroke-opacity=".5"/><text x="216" y="353" fill="#a9c5ff">IMPACTOS</text></g>
</svg>
